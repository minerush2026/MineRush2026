<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MineRush2026 Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .container {
      width: 100%;
      max-width: 1300px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    .box {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.2);
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      background: #334155;
      color: #fff;
      outline: none;
    }

    input::placeholder {
      color: #94a3b8;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .logout {
      background: #ef4444;
    }

    .refresh {
      background: #2563eb;
    }

    .reject {
      background: #dc2626;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #166534;
    }

    .error {
      display: block;
      background: #991b1b;
    }

    .dashboard {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(200px, 1fr)
        );
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.15);
    }

    .stat-title {
      color: #94a3b8;
      font-size: 14px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
      word-break: break-word;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
      border-bottom:
        1px solid #334155;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      color: #94a3b8;
      background: #172033;
      position: sticky;
      top: 0;
    }

    tr:hover td {
      background: #243247;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-pending {
      background: #92400e;
      color: #fef3c7;
    }

    .status-paid {
      background: #166534;
      color: #dcfce7;
    }
