<!doctype html><html><head><meta charset="utf-8"><title>MineRush Admin</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:15px;background:#0d1324;color:#fff}.box{background:#151e34;padding:18px;border-radius:15px;margin:12px 0}button,input{padding:10px;border-radius:8px;border:0;margin:4px}button{cursor:pointer}</style></head><body><h1>MineRush2026 Admin</h1><input id="key" placeholder="Admin key" type="password"><button onclick="load()">Load stats</button><div id="out"></div><script>async function load(){const k=document.getElementById('key').value;const h={'x-admin-key':k};const s=await fetch('/api/admin/stats',{headers:h}).then(r=>r.json());const w=await fetch('/api/admin/withdrawals',{headers:h}).then(r=>r.json());document.getElementById('out').innerHTML='<div class=box>Users: '+(s.users||0)+'<br>Pending withdrawals: '+(s.pendingWithdrawals||0)+'<br>Total MRX: '+(s.totalMRX||0)+'</div><div class=box><pre>'+JSON.stringify(w.items||w,null,2)+'</pre></div>'}</script></body></html>
