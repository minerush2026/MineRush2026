<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MineRush2026</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="brand">⛏️ MineRush2026</div>
      <div class="pill">FREE MINING</div>
      <h1 id="balance">0 MRX</h1>
      <p>Virtual reward points</p>
    </section>

    <section class="card mining">
      <div>
        <b>Mining rate</b>
        <span id="rate">10 MRX/hour</span>
      </div>
      <button id="claim">Claim Mining</button>
      <small id="status">Ready</small>
    </section>

    <section class="grid">
      <button class="card action" id="daily">🎁 Daily Bonus</button>
      <button class="card action" id="ad">📺 Watch Ad</button>
      <button class="card action" id="ref">👥 Invite Friends</button>
      <button class="card action" id="withdraw">💸 Withdraw</button>
    </section>

    <section class="card">
      <h3>How it works</h3>
      <p>Start mining, claim MRX, complete rewards and invite friends. MRX is an in-app virtual points balance.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
